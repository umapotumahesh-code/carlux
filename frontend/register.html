<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - CARLUX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">

    <!-- Back Button -->
    <div class="container-fluid py-3">
        <button onclick="window.location.href='login.html'" class="btn btn-outline-secondary" title="Back to Login">
            <i class="fas fa-arrow-left me-2"></i>Back to Login
        </button>
    </div>

    <main class="login-container">
        <div class="login-card card shadow-lg">
            <div class="card-body">
                <h3 class="card-title text-center mb-3">Create your account</h3>
                <p class="text-muted text-center">Join CARLUX — it only takes a moment.</p>

                <form id="register-form" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Account type:</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="account-type" id="customer-account" value="customer" checked>
                            <label class="form-check-label" for="customer-account">Customer</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="account-type" id="seller-account" value="seller">
                            <label class="form-check-label" for="seller-account">Seller</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Full name</label>
                        <input type="text" class="form-control" id="name" placeholder="Your name" required>
                        <div class="invalid-feedback">Please enter your name.</div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                        <div class="invalid-feedback">Please enter a valid email.</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Create a password" required>
                        <div class="invalid-feedback">Please enter a password (min 6 chars).</div>
                    </div>
                    <div class="mb-3">
                        <label for="confirm-password" class="form-label">Confirm password</label>
                        <input type="password" class="form-control" id="confirm-password" placeholder="Repeat password" required>
                        <div class="invalid-feedback">Passwords must match.</div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Create account</button>
                    </div>
                </form>

                <p class="text-center mt-3 small">Already have an account? <button onclick="window.location.href='login.html'" class="btn btn-link p-0">Login</button></p>
                <div id="register-message" class="mt-3" aria-live="polite"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="register.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const backButton = document.querySelector('.container-fluid .btn-outline-secondary');
            if (backButton) {
                backButton.addEventListener('click', function() {
                    window.location.href = 'login.html';
                });
            }
        });
    </script>
</body>
</html>
