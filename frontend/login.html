<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CARLUX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">

    <!-- Back Button -->
    <div class="container-fluid py-3">
        <a href="index.html" class="btn btn-outline-secondary" title="Back to Home" id="back-home">
            <i class="fas fa-arrow-left me-2"></i>Back to Home
        </a>
    </div>

    <main class="login-container">
        <div class="login-card card shadow-lg">
            <div class="card-body">
                <h3 class="card-title text-center mb-3">Welcome back</h3>
                <p class="text-muted text-center">Sign in to continue to CARLUX</p>

                <form id="login-form" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Login as:</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="user-type" id="customer-radio" value="customer" checked>
                            <label class="form-check-label" for="customer-radio">Customer</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="user-type" id="seller-radio" value="seller">
                            <label class="form-check-label" for="seller-radio">Seller</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username or Email</label>
                        <input type="email" class="form-control" id="username" placeholder="you@example.com" required>
                        <div class="invalid-feedback">Please enter your email.</div>
                    </div>

                    <div class="mb-3 position-relative">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                            <button class="btn btn-outline-secondary" type="button" id="toggle-password" aria-label="Toggle password"><i class="fa-regular fa-eye"></i></button>
                        </div>
                        <div class="invalid-feedback">Please enter your password.</div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <input id="remember" type="checkbox">
                            <label for="remember" class="small"> Remember me</label>
                        </div>
                        <div>
                            <a href="#" id="forgot-link">Forgot password?</a>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                </form>

                <div id="login-message" class="mt-3" aria-live="polite"></div>
                            <p class="text-center mt-3">Don't have an account? <button onclick="window.location.href='register.html'" class="btn btn-link p-0">Create account</button></p>
            </div>
        </div>
    </main>

    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotModal" tabindex="-1" aria-labelledby="forgotModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="forgotModalLabel">Reset password</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="small text-muted">Enter your email and we'll send a password reset link.</p>
            <div class="mb-3">
                <label for="reset-email" class="form-label">Email address</label>
                <input type="email" id="reset-email" class="form-control" placeholder="you@example.com">
                <div class="invalid-feedback">Enter a valid email.</div>
            </div>
            <div id="reset-message" class="small"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary" id="send-reset">Send reset link</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
    <!-- Back link is a normal anchor to ensure navigation works without JS interference -->
</body>
</html>
